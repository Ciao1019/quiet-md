<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">quiet.md — macOS 上的本地笔记应用</title>
  <desc id="hero-desc">左侧是 quiet.md 的名字和主张「笔记，就是硬盘上的一个文件」，右侧是文档库文件夹 ~/Documents/Quiet.md 里的四篇笔记文件。</desc>

  <rect width="1200" height="400" rx="24" fill="#F6F5F1"/>
  <line x1="756" y1="56" x2="756" y2="344" stroke="#E4E2DC"/>

  <!-- name and promise -->
  <g id="title-block">
    <text x="64" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17"
          letter-spacing="2.2" fill="#8B9097">MACOS · RUST + GPUI · LOCAL-FIRST</text>

    <rect x="60" y="128" width="6" height="80" rx="3" fill="#3A85F7"/>
    <text x="84" y="204" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif"
          font-size="96" font-weight="700" letter-spacing="-3" fill="#1B1D21">quiet.md</text>

    <text x="64" y="262" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif"
          font-size="32" font-weight="600" fill="#2A2D31">笔记，就是硬盘上的一个文件。</text>

    <text x="64" y="302" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif"
          font-size="19" fill="#666B72">打开即写，不联网，也不用账号。笔记是你的文件，随时备份、同步、带走。</text>

    <text x="64" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16"
          letter-spacing="1.2" fill="#8B9097">v0.1.0 · APPLE SILICON · macOS 13+ · MIT</text>
  </g>

  <!-- the library as it is on disk -->
  <g id="library-card">
    <rect x="792" y="64" width="344" height="272" rx="16" fill="#FFFFFF" stroke="#E6E4DE"/>

    <g id="library-path">
      <path d="M812 84h6l3 3h9a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-18a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2z"
            fill="none" stroke="#9AA0A6" stroke-width="1.4"/>
      <text x="838" y="99" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16"
            fill="#8B9097">~/Documents/Quiet.md</text>
    </g>
    <line x1="792" y1="112" x2="1136" y2="112" stroke="#EFEDE8"/>

    <g id="library-contents" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif"
       font-size="17" fill="#33373C">
      <rect x="804" y="140" width="320" height="32" rx="8" fill="#EFF5FE"/>
      <path d="M812 147h7l3 3h9a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-19a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2z"
            fill="none" stroke="#9AA0A6" stroke-width="1.4"/>
      <text x="842" y="161">docs/</text>
      <text x="1112" y="161" text-anchor="end" font-size="15" fill="#9AA0A6">11 篇笔记</text>

      <path d="M812 181h7l3 3h9a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-19a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2z"
            fill="none" stroke="#9AA0A6" stroke-width="1.4"/>
      <text x="842" y="195">assets/</text>
      <text x="1112" y="195" text-anchor="end" font-size="15" fill="#9AA0A6">图片与附件</text>

      <path d="M812 215h7l3 3h9a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-19a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2z"
            fill="none" stroke="#9AA0A6" stroke-width="1.4"/>
      <text x="842" y="229">themes/</text>
      <text x="1112" y="229" text-anchor="end" font-size="15" fill="#9AA0A6">你写的 CSS</text>

      <rect x="812" y="247" width="14" height="18" rx="3" fill="none" stroke="#9AA0A6" stroke-width="1.4"/>
      <path d="M816 252h6M816 256h6M816 260h4" stroke="#B6BBC1" stroke-width="1.4"/>
      <text x="842" y="263" fill="#33373C">index.json</text>
      <text x="1112" y="263" text-anchor="end" font-size="15" fill="#9AA0A6">丢了能重建</text>
    </g>

    <line x1="792" y1="286" x2="1136" y2="286" stroke="#EFEDE8"/>
    <text x="812" y="314" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif"
          font-size="15" fill="#9AA0A6">一个普通文件夹，随时备份、同步</text>
  </g>
</svg>
